[project]
name = "invoice-processing"
version = "0.2.0"
description = "A multi-agent invoice processing prototype."
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.5.0,<6.0.0",
    "defusedxml>=0.7.1,<1.0.0",
    "fastapi>=0.128.0,<1.0.0",
    "langgraph>=1.0.8,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",
    "openai>=2.11.0,<3.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "pymupdf>=1.26.0,<2.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "rich>=15.0.0,<16.0.0",
    "sqlalchemy>=2.0,<3.0",
    "structlog>=24.4.0,<26.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "pytest>=8.3.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
